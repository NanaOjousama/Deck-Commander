name: Offline tests
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python sources and run simulation suites
        run: |
          python -m compileall -q router.py pair_windows.py transfer_reliability.py folder_backend.py folder_transfer.py resumable_file_transfer.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: node --check gateway.mjs