name: Disposable tunnel HTTP authorization boundary
on:
  push:
    branches:
      - security/connector-auth-boundary-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-auth-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned official tunnel-client dev build with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tunnel-client-v0.0.20-linux-amd64.zip"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 90 \
            --output "$archive" \
            https://github.com/openai/tunnel-client/releases/download/v0.0.20/tunnel-client-v0.0.20-linux-amd64.zip
          echo "2f06ce5a17425c74a827e7038692936e973ae388e7eec728c40efee1fb5f139d  $archive" | sha256sum --check
          python - "$archive" "$RUNNER_TEMP" <<'PY'
          import pathlib,sys,zipfile
          archive=pathlib.Path(sys.argv[1])
          root=pathlib.Path(sys.argv[2])/'dc-tunnel-ci-extracted'
          root.mkdir()
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  path=pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe archive path')
              z.extractall(root)
          binaries=[p for p in root.rglob('tunnel-client') if p.is_file() and not p.is_symlink()]
          if len(binaries)!=1:
              raise SystemExit('Expected exactly one official binary')
          binary=binaries[0]
          binary.chmod(binary.stat().st_mode | 0o100)
          with open(pathlib.Path(sys.argv[2])/'dc-tunnel-ci-binary.txt','w') as f:
              f.write(str(binary))
          PY
      - name: Prove two synthetic identities and token revocation through real local tunnel-client
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          bin="$(cat "$RUNNER_TEMP/dc-tunnel-ci-binary.txt")"
          python security_tests/secure_tunnel_http_auth_probe.py --tunnel-client "$bin"
      - name: Confirm existing gateway and transfer Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
