name: Disposable systemd crash containment
on:
  push:
    branches:
      - security/systemd-crash-containment-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-linux-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify disposable systemd and OpenSSH prerequisites
        run: |
          test "$(cat /proc/1/comm)" = systemd
          sudo -n true
          if ! test -x /usr/lib/openssh/sftp-server && ! test -x /usr/lib/ssh/sftp-server; then
            sudo apt-get update -qq
            sudo apt-get install -y openssh-sftp-server
          fi
          test -x /usr/bin/sftp
      - name: Confirm existing isolated subprocess tests
        run: node --test tests/test_process_tree.mjs tests/test_transfer_registry.mjs
      - name: Kill disposable gateway main process and verify systemd cgroup cleanup
        timeout-minutes: 4
        run: python tests/test_systemd_crash_cleanup.py
